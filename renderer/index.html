<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>MikTime</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1a;--cyan:#3cf2ff;--magenta:#ff3cff;--green:#3cff72;--red:#ff4d4d;--amber:#ffc94d;}
html,body{margin:0;height:100%;font-family:'Press Start 2P',monospace;color:#e8f7ff;background:transparent;}
body{display:flex;align-items:center;justify-content:center;}
.card{width:340px;background:linear-gradient(#10162a,#060914);border:4px solid var(--green);box-shadow:0 0 0 2px #060914,0 0 24px rgba(60,255,114,.35);
  padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;image-rendering:pixelated;position:relative;-webkit-app-region:drag;}
.title{font-size:14px;color:var(--green);text-shadow:0 0 6px var(--green);letter-spacing:1px}
.close{-webkit-app-region:no-drag;position:absolute;top:6px;right:10px;cursor:pointer;color:var(--red);font-size:14px;font-weight:700}
.head{font-size:9px;opacity:.8;margin-top:-6px}
.timer{font-size:34px;color:var(--amber);text-shadow:0 0 8px var(--amber);letter-spacing:2px}
.label{font-size:9px;color:var(--cyan);margin-top:2px}
.barwrap{width:100%;height:24px;border:3px solid #e8f7ff;background:#000;padding:2px;-webkit-app-region:no-drag;image-rendering:pixelated}
.bar{height:100%;width:100%;background:repeating-linear-gradient(90deg,var(--green) 0 8px,transparent 8px 10px);transition:width .2s linear,image 0}
.health{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:100%;height:16px;-webkit-app-region:no-drag}
.pip{background:#1a2240;border:1px solid #2d3a66}
.pip.on{background:var(--red);box-shadow:0 0 4px var(--red)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;-webkit-app-region:no-drag}
button{font-family:inherit;font-size:9px;color:#060914;padding:8px 4px;border:none;cursor:pointer;background:var(--green);box-shadow:inset -2px -2px 0 #1a6b34,inset 2px 2px 0 #aaffc4}
button:hover{filter:brightness(1.2)}
button.warn{background:var(--amber);box-shadow:inset -2px -2px 0 #6b4a00,inset 2px 2px 0 #ffe4a0}
button.danger{background:var(--red);box-shadow:inset -2px -2px 0 #6b0000,inset 2px 2px 0 #ffa0a0;color:#fff}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;-webkit-app-region:no-drag}
.custom{display:flex;gap:6px;width:100%;-webkit-app-region:no-drag}
.custom input{flex:1;font-family:inherit;font-size:9px;color:var(--cyan);background:#000;border:3px solid var(--cyan);padding:6px}
.custom button{background:var(--cyan);box-shadow:inset -2px -2px 0 #0a7a88,inset 2px 2px 0 #b8ffff}
.hint{font-size:7px;opacity:.7;text-align:center}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.done{color:var(--magenta);animation:blink .8s infinite}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="close" onclick="window.close()">X</div>
  <div class="title">MIKTIME</div>
  <div class="head">ARCADE FOCUS TIMER</div>
  <div class="timer" id="display">25:00</div>
  <div class="label" id="label">FOCUS</div>
  <div class="barwrap"><div class="bar" id="bar"></div></div>
  <div class="health" id="health"></div>
  <div class="btns">
    <button class="primary" id="start">START</button>
    <button class="warn" id="pause">PAUSE</button>
    <button class="danger" id="reset">RESET</button>
  </div>
  <div class="presets">
    <button data-m="25">25</button>
    <button data-m="50">50</button>
    <button data-m="15">15</button>
    <button data-m="5">5</button>
  </div>
  <div class="custom">
    <input id="mins" type="number" min="1" value="25" placeholder="MIN"/>
    <button id="set">SET</button>
  </div>
  <div class="hint">PRESS START TO BEGIN  ·  DRAG TOP BAR TO MOVE</div>
</div>
<script src="app.js"></script>
</body>
</html>
EOF
